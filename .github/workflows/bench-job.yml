name: Reusable Benchmark Job
# Reusable workflow for running benchmarks with caching

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      branch_type:
        description: "Type of branch (base or pr)"
        required: true
        type: string
      git_ref:
        description: "Git reference to checkout"
        required: true
        type: string
      repository:
        description: "Repository to checkout from"
        required: false
        type: string
        default: ""
      force_rerun:
        description: "Force re-run benchmarks even if cache exists"
        required: false
        type: boolean
        default: false

jobs:
  benchmark:
    name: Benchmark ${{ inputs.branch_type }} branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep measurements outside Cargo's target: rust-cache cleans it on restore
    # and again in its post-job hook, before the benchmark cache is saved.
    env:
      CRITERION_HOME: ${{ github.workspace }}/benchmark-results/criterion
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.git_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the compiler before cache lookup: a cached result from another
      # stable release must never be compared with a freshly compiled branch.
      - uses: dtolnay/rust-toolchain@stable

      # Benchmark inputs and the build environment both affect measured time.
      - name: Generate cache key from code content
        id: cache-key
        run: |
          CONTENT_HASH="${{ hashFiles('crates/typstyle-core/**/*.rs', 'crates/typstyle-core/Cargo.toml', 'crates/typstyle/**/*.rs', 'crates/typstyle/Cargo.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config*', 'tests/fixtures/**/*.typ', '.github/workflows/bench-job.yml') }}"
          RUSTC_INFO="$(rustc -vV)"
          CPU_INFO="$(lscpu --json | jq -c '[.lscpu[] | select(.field == "Architecture:" or .field == "CPU(s):" or .field == "Vendor ID:" or .field == "Model name:" or .field == "Model:" or .field == "Stepping:" or .field == "Flags:")]')"
          ENVIRONMENT_HASH="$(printf '%s\n' "$RUSTC_INFO" "$CPU_INFO" "$(uname -sr)" "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}" | sha256sum | cut -d ' ' -f 1)"
          echo "content-hash=${CONTENT_HASH:0:16}" >> $GITHUB_OUTPUT
          echo "environment-hash=$ENVIRONMENT_HASH" >> $GITHUB_OUTPUT
          echo "Generated content hash: ${CONTENT_HASH:0:16}"
          echo "Benchmark environment: $ENVIRONMENT_HASH"
          mkdir -p benchmark-results
          jq -n --arg fingerprint "$ENVIRONMENT_HASH" --arg rustc "$RUSTC_INFO" --arg cpu "$CPU_INFO" \
            '{fingerprint: $fingerprint, rustc: $rustc, cpu: ($cpu | fromjson)}' \
            > benchmark-results/benchmark-environment.json

          # The same validation protects cache reuse and freshly produced data.
          # Keep it in runner storage: checked-out base revisions may predate it.
          cat > "$RUNNER_TEMP/validate-benchmark-results.sh" <<'BASH'
          set -euo pipefail
          branch="$1"
          jq -e '(."file-size" | numbers > 0) and (."text-section-size" | numbers > 0) and (.crates | type == "array")' \
            "benchmark-results/bloat/bloat-$branch.json" > /dev/null
          mapfile -t baselines < <(find "$CRITERION_HOME" -type d -name "$branch")
          if [ "${#baselines[@]}" -eq 0 ]; then
            echo "No Criterion baselines found for $branch" >&2
            exit 1
          fi
          for baseline in "${baselines[@]}"; do
            jq -e '(.iters | type == "array" and length > 0) and (.times | type == "array") and (.iters | length) == (.times | length)' \
              "$baseline/sample.json" > /dev/null
            jq -e '[.mean, .median, .median_abs_dev, .std_dev] | all(.[];
              [.point_estimate, .standard_error, .confidence_interval.confidence_level,
               .confidence_interval.lower_bound, .confidence_interval.upper_bound]
              | all(.[]; type == "number"))' "$baseline/estimates.json" > /dev/null
            jq -e '[.group_id, .full_id, .directory_name] | all(.[]; type == "string" and length > 0)' \
              "$baseline/benchmark.json" > /dev/null
          done
          BASH

      # No restore keys: source, fixtures, compiler, and runner must match.
      - name: Cache criterion benchmark data
        uses: actions/cache@v4
        id: bench-cache
        with:
          path: |
            benchmark-results/criterion
            benchmark-results/bloat
          key: criterion-v3-${{ inputs.branch_type }}-${{ steps.cache-key.outputs.environment-hash }}-${{ steps.cache-key.outputs.content-hash }}

      - name: Check for cached benchmark
        id: check-cache
        run: |
          # Check cache status and validate cached data
          if [ "${{ steps.bench-cache.outputs.cache-hit }}" == "true" ] && [ "${{ inputs.force_rerun }}" != "true" ]; then
            # Validate that cached data is complete and valid
            if bash "$RUNNER_TEMP/validate-benchmark-results.sh" "${{ inputs.branch_type }}" > /dev/null 2>&1; then
              echo "Found valid cached benchmark and bloat results"
              echo "Using cache from key: ${{ steps.bench-cache.outputs.cache-matched-key }}"
              echo "cache-hit=true" >> $GITHUB_OUTPUT
            else
              echo "Cache hit but data incomplete, will re-run benchmark"
              echo "cache-hit=false" >> $GITHUB_OUTPUT
            fi
          else
            if [ "${{ inputs.force_rerun }}" == "true" ]; then
              echo "Forcing benchmark rerun (cache ignored)"
            else
              echo "No cached benchmark results found"
            fi
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi

      - name: Install cargo-bloat
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - uses: Swatinem/rust-cache@v2
        if: steps.check-cache.outputs.cache-hit != 'true'

      - name: Run benchmark
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          # Discard incomplete or explicitly bypassed benchmark cache data.
          rm -rf "$CRITERION_HOME"
          echo "Running ${{ inputs.branch_type }} branch benchmark..."
          cargo bench -p typstyle-core --benches -- --save-baseline ${{ inputs.branch_type }}

      - name: Build release binary and collect bloat data
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          echo "Building release binary for ${{ inputs.branch_type }} branch..."
          BINARY_NAME="typstyle"
          cargo build --release --bin $BINARY_NAME

          if [ -f "target/release/$BINARY_NAME" ]; then
            # Create bloat data directory
            mkdir -p benchmark-results/bloat

            # Generate cargo-bloat report in JSON format
            cargo bloat --release --crates --bin $BINARY_NAME --message-format json > benchmark-results/bloat/bloat-${{ inputs.branch_type }}.json

            echo "Cargo-bloat analysis completed"
          else
            echo "Error: Release binary not found at target/release/$BINARY_NAME"
            exit 1
          fi

      # Run on both benchmark cache hits and fresh builds, after all restores.
      - name: Validate benchmark results
        env:
          EXPECTED_FINGERPRINT: ${{ steps.cache-key.outputs.environment-hash }}
        run: |
          jq -e --arg fingerprint "$EXPECTED_FINGERPRINT" \
            '.fingerprint == $fingerprint and (.rustc | length > 0)' \
            benchmark-results/benchmark-environment.json > /dev/null
          bash "$RUNNER_TEMP/validate-benchmark-results.sh" "${{ inputs.branch_type }}"

      # Always upload artifacts for reliable cross-job data transfer
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.branch_type }}
          path: benchmark-results/
          retention-days: 1
          if-no-files-found: error
