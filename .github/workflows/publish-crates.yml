name: Publish Crates to crates.io

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Perform a dry run without actually publishing"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform a dry run without actually publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p typstyle-core --dry-run
          echo "Skipping the CLI dry-run: it requires the new core release on crates.io."

      - name: Publish crates
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "typstyle-core"))')

          wait_for_crate() {
            local name=$1
            for _ in $(seq 1 60); do
              if curl -fsS -A typstyle-release \
                "https://crates.io/api/v1/crates/${name}/${VERSION}" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            echo "timed out waiting for ${name}@${VERSION} on crates.io" >&2
            return 1
          }

          cargo publish -p typstyle-core
          wait_for_crate typstyle-core
          cargo publish -p typstyle
