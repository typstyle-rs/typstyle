name: Benchmark for PR
# Base and PR benchmarks run serially on one runner with cached builds.
# Base benchmarks use the upstream repository to ensure base revision exists.
# PR benchmarks use the fork repository for the head revision.
# Fresh measurements are compared directly on the same runner.

permissions:
  contents: read
  actions: read
  pull-requests: read

on:
  pull_request:
    paths:
      - "crates/typstyle-core/**"
      - "crates/typstyle/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/**/*.typ"
      - ".cargo/config*"
      - ".github/workflows/bench-pr.yml"
      - ".github/scripts/*benchmark*.nu"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to benchmark"
        required: true
        type: number

jobs:
  pre_job:
    permissions:
      actions: write
      contents: read
    name: Duplicate Actions Detection
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: "true"
          paths: '["crates/typstyle-core/**", "crates/typstyle/**", "Cargo.toml", "Cargo.lock", "tests/fixtures/**/*.typ", ".cargo/config*", ".github/workflows/bench-pr.yml", ".github/scripts/*benchmark*.nu"]'
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["workflow_dispatch"]'

  benchmark:
    name: Benchmark base and PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    env:
      BENCHMARK_RESULTS: ${{ github.workspace }}/benchmark-results
      CRITERION_HOME: ${{ github.workspace }}/benchmark-results/criterion
      # Match cargo-bloat's strip override to reuse benchmark dependencies.
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3

      - name: Resolve PR revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: nu .github/scripts/benchmark-pair.nu revisions

      - name: Checkout benchmark source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.revisions.outputs.head_repository }}
          ref: ${{ steps.revisions.outputs.head_sha }}
          path: benchmark-workspace
          # The helper fetches the base commit using the job's read-only token.
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install benchmark tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat,critcmp

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmark-workspace

      - name: Run base then PR
        run: nu .github/scripts/benchmark-pair.nu run

      - name: Generate comparison results
        shell: nu {0}
        run: nu .github/scripts/generate-benchmark-report.nu ($env.BENCHMARK_RESULTS | path join base) ($env.BENCHMARK_RESULTS | path join pr)

      - name: Upload benchmark comparison and PR info
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: benchmark-results/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Upload benchmark diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-diagnostics-${{ github.run_attempt }}
          path: benchmark-results/
          retention-days: 7
          if-no-files-found: ignore
