name: Benchmark for PR
# This workflow runs benchmarks in parallel jobs with caching for performance.
# Base benchmarks use the upstream repository to ensure base revision exists.
# PR benchmarks use the fork repository for the head revision.
# Results are compared in a final job using artifacts for reliable data transfer.

permissions:
  contents: read
  actions: read
  pull-requests: read

on:
  pull_request:
    paths:
      - "crates/typstyle-core/**"
      - "crates/typstyle/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/**/*.typ"
      - ".cargo/config*"
      - ".github/scripts/*benchmark*.nu"
      - ".github/workflows/bench-pr.yml"
      - ".github/workflows/bench-job.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to benchmark"
        required: true
        type: number
      force_rerun:
        description: "Force re-run benchmarks even if cache exists"
        required: false
        default: false
        type: boolean

jobs:
  pre_job:
    permissions:
      actions: write
      contents: read
    name: Duplicate Actions Detection
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: "true"
          paths: '["crates/typstyle-core/**", "crates/typstyle/**", "Cargo.toml", "Cargo.lock", "tests/fixtures/**/*.typ", ".cargo/config*", ".github/scripts/*benchmark*.nu", ".github/workflows/bench-pr.yml", ".github/workflows/bench-job.yml"]'
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["workflow_dispatch"]'

  revisions:
    name: Resolve benchmark revisions
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    outputs:
      base_sha: ${{ steps.revisions.outputs.base_sha }}
      base_repository: ${{ steps.revisions.outputs.base_repository }}
      head_sha: ${{ steps.revisions.outputs.head_sha }}
      head_repository: ${{ steps.revisions.outputs.head_repository }}
      pr_number: ${{ steps.revisions.outputs.pr_number }}
    steps:
      - name: Resolve exact PR commits
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || [ "$PR_NUMBER" -le 0 ]; then
              echo "A positive PR number is required" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/benchmark-pr.json"
          else
            jq -e '.pull_request' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/benchmark-pr.json"
          fi
          jq -er '
            "base_sha=" + .base.sha,
            "base_repository=" + .base.repo.full_name,
            "head_sha=" + .head.sha,
            "head_repository=" + .head.repo.full_name,
            "pr_number=" + (.number | tostring)
          ' "$RUNNER_TEMP/benchmark-pr.json" >> "$GITHUB_OUTPUT"

  bench-base:
    name: Benchmark base branch
    uses: ./.github/workflows/bench-job.yml
    needs: [pre_job, revisions]
    if: needs.pre_job.outputs.should_skip != 'true'
    with:
      branch_type: base
      git_ref: ${{ needs.revisions.outputs.base_sha }}
      repository: ${{ needs.revisions.outputs.base_repository }}
      force_rerun: ${{ inputs.force_rerun || false }}

  bench-pr:
    name: Benchmark PR branch
    uses: ./.github/workflows/bench-job.yml
    needs: [pre_job, revisions]
    if: needs.pre_job.outputs.should_skip != 'true'
    with:
      branch_type: pr
      git_ref: ${{ needs.revisions.outputs.head_sha }}
      repository: ${{ needs.revisions.outputs.head_repository }}
      force_rerun: ${{ inputs.force_rerun || false }}

  compare:
    name: Generate benchmark comparison
    runs-on: ubuntu-latest
    needs: [revisions, bench-base, bench-pr]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3

      - name: Install critcmp
        uses: taiki-e/install-action@v2
        with:
          tool: critcmp

      - name: Download base benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-base
          path: base-results

      - name: Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-pr
          path: pr-results

      - name: Prepare benchmark data for comparison
        run: |
          mkdir -p target/criterion

          # Merge base and PR benchmark results
          cp -r base-results/criterion/. target/criterion/
          cp -r pr-results/criterion/. target/criterion/

          echo "Final benchmark structure:"
          ls -la target/criterion/

      - name: Generate comparison results
        run: |
          # Generate complete benchmark and binary size comparison report
          nu .github/scripts/generate-benchmark-report.nu base-results pr-results

      - name: Save PR number
        run: |
          mkdir -p ./pr-info
          echo ${{ needs.revisions.outputs.pr_number }} > ./pr-info/PR_NUMBER
          echo "Saved PR number: ${{ needs.revisions.outputs.pr_number }}"

      - name: Upload benchmark comparison and PR info
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            benchmark-results.md
            pr-info/
          retention-days: 7
